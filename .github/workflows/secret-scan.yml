# Secret scanning — blocks pushes that expose secrets in git history.
# Uses Gitleaks (MIT). Runs on every push and pull request BEFORE deployment.
#
# If this job fails: a secret was detected in the pushed commits. Do NOT
# force-push past it — rotate the secret first, then remove it with
# git-filter-repo, then push again.
name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Detect exposed secrets (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # scan full history, not just the last commit

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
