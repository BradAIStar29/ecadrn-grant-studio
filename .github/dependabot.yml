# Dependabot — real manifest locations (replaces the empty UI template,
# which errored out and would never have opened a PR).
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Frontend (React + Vite) — package.json at /ecadrn-grant-studio
  - package-ecosystem: "npm"
    directory: "/ecadrn-grant-studio"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # Cloudflare Worker — package.json at /ecadrn-grant-studio/worker
  - package-ecosystem: "npm"
    directory: "/ecadrn-grant-studio/worker"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions workflow bumps (actions/checkout, codeql-action, etc.)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
