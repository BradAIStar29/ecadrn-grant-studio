name = "ecadrn-grant-studio-ai"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Workers Logs — required to see runtime errors (the 2026-10-31 Agent Write
# failure left no trace because this was never enabled).
[observability]
enabled = true

[vars]
ALLOWED_ORIGIN = "https://bradaistar29.github.io"

# AI Model Fallback State — Cloudflare KV stores the current model tier and
# cooldown state for automatic model switching when rate limits are hit.
#
# KV namespace created 2026-09-17 via Cloudflare API (id below).
[[kv_namespaces]]
binding = "AI_CONFIG"
id = "b4307708c7ea4780820594251d626464"
