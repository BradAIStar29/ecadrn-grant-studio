<!doctype html>
<html lang="en">
  <head>
    <!-- Security: strict referrer + CSP. Allowlist covers Firebase (googleapis/firebaseio),
         Google Drive/Gmail OAuth (accounts.google.com), and the Cloudflare worker API.
         If App Check is ever enabled, add https://www.google.com to script-src and
         connect-src (reCAPTCHA v3). localhost ports keep local dev working. -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://accounts.google.com https://ecadrn-grant-studio-ai.bradley-8b2.workers.dev http://localhost:3000 http://localhost:5173 http://localhost:8787; frame-src https://accounts.google.com https://*.firebaseapp.com; object-src 'none'; base-uri 'self'; form-action 'self'" />

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>ECADRN Grant Studio</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📋</text></svg>" />
    <script>
      // Anti-FOUC: apply dark mode before first paint
      (function() {
        try {
          var stored = localStorage.getItem('ecadrn_dark_mode');
          if (stored === 'true' || stored === '"true"') {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
